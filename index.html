<body>
<div class="wrap">
  <header>
    <h1>印即得彩卡报价工具</h1>
    <span class="ver">V1_260831</span>
  </header>

  <section class="card">
    <div class="bar bar-teal">基础参数</div>
    <div class="grid">
      <div class="dd">
        <label for="gsm">克重 <span class="unit">(G)</span></label>
        <div class="dd-in">
          <input type="text" id="gsm" value="250G" inputmode="numeric" autocomplete="off" placeholder="250G">
          <button type="button" class="dd-caret" data-target="gsm" aria-label="选择预设">▾</button>
        </div>
        <div class="dd-menu" data-target="gsm">
          <button type="button" class="dd-opt" data-val="250G">250G</button>
          <button type="button" class="dd-opt" data-val="300G">300G</button>
        </div>
      </div>
      <div class="dd">
        <label for="paperType">纸张类型</label>
        <div class="dd-in">
          <input type="text" id="paperType" value="单卡纸" inputmode="text" autocomplete="off" placeholder="单卡纸">
          <button type="button" class="dd-caret" data-target="paperType" aria-label="选择预设">▾</button>
        </div>
        <div class="dd-menu" data-target="paperType">
          <button type="button" class="dd-opt" data-val="单卡纸">单卡纸</button>
          <button type="button" class="dd-opt" data-val="铜版纸">铜版纸</button>
        </div>
      </div>
      <div>
        <label for="tonPrice">吨价 <span class="unit">(元)</span></label>
        <input type="text" id="tonPrice" value="4200" inputmode="numeric" min="200" max="20000">
      </div>
      <div>
        <label for="machineFee">上机费 <span class="unit">(元)</span></label>
        <input type="text" id="machineFee" value="140" inputmode="numeric" min="0" max="500">
      </div>
      <div>
        <label for="output">出数 <span class="unit">(张)</span></label>
        <input type="text" id="output" value="50" inputmode="numeric" min="0" max="500">
      </div>
      <div>
        <label for="film">覆膜 <span class="unit">(元/m²)</span></label>
        <input type="number" id="film" value="0.4" inputmode="decimal" step="any" min="0" max="10">
      </div>
    </div>
  </section>

  <div class="formula">
    <div class="ft">计算公式</div>
    <div class="fl"><b>单张纸价</b> = (长÷1000) × (宽÷1000) × (克重÷1000) × 吨价 ÷ 1000</div>
    <div class="fl"><b>单张覆膜费</b> = 覆膜单价 × (长÷1000) × (宽÷1000)</div>
    <div class="fl"><b>小计</b> = (单张纸价 + 单张覆膜费) × (数量 + 出数) + 上机费 − 出数 × 单张覆膜费</div>
    <div class="fn">单位换算：尺寸 mm→m、克重 g/m²→kg/m²、重量 kg→吨、覆膜 元/m²</div>
  </div>

  <section class="card">
    <div class="bar bar-indigo">报价明细</div>
    <div class="grid-row head-row">
      <div>#</div>
      <div>尺寸 (mm)</div>
      <div class="c">数量</div>
      <div class="r">单张纸价</div>
      <div class="r">单张覆膜</div>
      <div class="r">小计</div>
      <div></div>
    </div>
    <div id="rows"></div>
    <button class="add" id="btnAdd" type="button">＋ 添加一行</button>
  </section>

  <section class="total-card">
    <span class="k">合计</span>
    <span class="v zero" id="rTotal">¥0.00</span>
  </section>

  <button class="btn-copy" id="btnCopy" type="button">复制报价明细</button>

  <footer>copyright©OldK</footer>
</div>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var rowsBox = $("rows");
  var CLAMPS = { tonPrice: [200, 20000], machineFee: [0, 500], output: [0, 500], film: [0, 10] };

  function fmt3(n) { return n.toLocaleString("zh-CN", { minimumFractionDigits: 3, maximumFractionDigits: 3 }); }
  function fmt2(n) { return n.toLocaleString("zh-CN", { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
  function eff(n) { return isFinite(n) ? n : 0; }
  function trimN(n) { return String(parseFloat(n.toFixed(4))); }

  function baseVals() {
    var gsmRaw = $("gsm").value.trim();
    var m = gsmRaw.match(/(\d+(?:\.\d+)?)/);
    var gsmNum = m ? eff(parseFloat(m[1])) : 0;
    var typeRaw = $("paperType").value.trim();
    var gsmStr = m ? (trimN(gsmNum) + "G") : "—";
    return {
      paperName: gsmStr + (typeRaw ? typeRaw : ""),
      gsm: gsmNum,
      ton: eff(parseFloat($("tonPrice").value)),
      fee: eff(parseFloat($("machineFee").value)),
      out: eff(parseFloat($("output").value)),
      film: eff(parseFloat($("film").value))
    };
  }

  function renumber() {
    Array.prototype.forEach.call(rowsBox.children, function (line, i) {
      line.querySelector(".no").textContent = i + 1;
    });
  }

  function makeRow() {
    var line = document.createElement("div");
    line.className = "line grid-row";
    line.innerHTML =
      '<div class="no"></div>'
      + '<div class="size-in">'
      + '<input type="number" class="in-len" placeholder="长" inputmode="decimal" step="any" min="10" max="1300">'
      + '<span class="x">×</span>'
      + '<input type="number" class="in-wid" placeholder="宽" inputmode="decimal" step="any" min="10" max="1300">'
      + '</div>'
      + '<input type="text" class="in-qty" placeholder="0" inputmode="numeric" min="1">'
      + '<div class="val unit dash">—</div>'
      + '<div class="val film dash">—</div>'
      + '<div class="val sub dash">—</div>'
      + '<button type="button" class="del" title="删除此行">✕</button>';
    rowsBox.appendChild(line);
    renumber();
    var lenEl = line.querySelector(".in-len");
    var widEl = line.querySelector(".in-wid");
    var qtyEl = line.querySelector(".in-qty");
    lenEl.addEventListener("input", calcAll);
    widEl.addEventListener("input", calcAll);
    qtyEl.addEventListener("input", function () { stripInt(this); calcAll(); });
    lenEl.addEventListener("change", function () { clampNum(this, 10, 1300); calcAll(); });
    widEl.addEventListener("change", function () { clampNum(this, 10, 1300); calcAll(); });
    qtyEl.addEventListener("change", function () { clampNum(this, 1, 9999999); calcAll(); });
    line.querySelector(".del").addEventListener("click", function () {
      if (rowsBox.children.length <= 1) {
        line.querySelector(".in-len").value = "";
        line.querySelector(".in-wid").value = "";
        line.querySelector(".in-qty").value = "";
      } else {
        line.remove();
        renumber();
      }
      calcAll();
    });
    return line;
  }

  function calcRow(line, b) {
    var len = parseFloat(line.querySelector(".in-len").value);
    var wid = parseFloat(line.querySelector(".in-wid").value);
    var qty = parseFloat(line.querySelector(".in-qty").value);
    var uEl = line.querySelector(".val.unit");
    var fEl = line.querySelector(".val.film");
    var sEl = line.querySelector(".val.sub");
    var ok = len > 0 && wid > 0 && qty > 0;
    if (!ok) {
      uEl.textContent = "—"; uEl.classList.add("dash");
      fEl.textContent = "—"; fEl.classList.add("dash");
      sEl.textContent = "—"; sEl.classList.add("dash");
      return null;
    }
    var unit = (len / 1000) * (wid / 1000) * (b.gsm / 1000) * b.ton / 1000;
    var filmPer = b.film * (len / 1000) * (wid / 1000);
    var sub = (unit + filmPer) * (qty + b.out) + b.fee - b.out * filmPer;
    uEl.textContent = fmt3(unit); uEl.classList.remove("dash");
    fEl.textContent = fmt3(filmPer); fEl.classList.remove("dash");
    sEl.innerHTML = '<span class="cny">¥</span>' + fmt2(sub); sEl.classList.remove("dash");
    return { len: len, wid: wid, qty: qty, unit: unit, filmPer: filmPer, sub: sub };
  }

  function calcAll() {
    var b = baseVals();
    var total = 0;
    var results = [];
    Array.prototype.forEach.call(rowsBox.children, function (line) {
      var r = calcRow(line, b);
      if (r) { total += r.sub; results.push(r); }
    });
    var tv = $("rTotal");
    tv.innerHTML = '<span class="cny">¥</span>' + fmt2(total);
    tv.classList.toggle("zero", total === 0);
    return { b: b, total: total, results: results };
  }

  function feedback(btn, msg, kind) {
    var label = "复制报价明细";
    if (btn._timer) { clearTimeout(btn._timer); btn._timer = null; }
    btn.textContent = msg;
    btn.classList.remove("ok", "warn");
    if (kind === "ok") btn.classList.add("ok");
    else if (kind === "warn") btn.classList.add("warn");
    btn._timer = setTimeout(function () {
      btn.textContent = label;
      btn.classList.remove("ok", "warn");
      btn._timer = null;
    }, 2000);
  }

  function copyText(text, btn) {
    function done() { feedback(btn, "已复制", "ok"); }
    function fallback() {
      var ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand("copy"); done(); } catch (e) {}
      document.body.removeChild(ta);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, fallback);
    } else {
      fallback();
    }
  }

  $("btnAdd").addEventListener("click", function () {
    var line = makeRow();
    calcAll();
    line.querySelector(".in-len").focus();
  });

  $("btnCopy").addEventListener("click", function () {
    var c = calcAll();
    var totalRows = rowsBox.children.length;
    if (!c.results.length || totalRows > c.results.length) { feedback($("btnCopy"), "请先填写明细", "warn"); return; }
    var b = c.b;
    var d = new Date();
    function pad2(n){return String(n).padStart(2,"0");}
    var dateStr = d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate()) + " " + pad2(d.getHours()) + ":" + pad2(d.getMinutes()) + ":" + pad2(d.getSeconds());
    var lines = [
      "纸张：" + b.paperName + " ｜ 吨价 " + trimN(b.ton) + "元 ｜ 上机费 " + trimN(b.fee) + "元 ｜ 出数 " + trimN(b.out) + "张 ｜ 覆膜 " + trimN(b.film) + "元/m²",
      "——————————"
    ];
    c.results.forEach(function (r, i) {
      lines.push((i + 1) + ". " + trimN(r.len) + "×" + trimN(r.wid) + "mm ｜ 数量 " + trimN(r.qty)
        + " ｜ 单张纸价 " + fmt3(r.unit) + "元 ｜ 单张覆膜 " + fmt3(r.filmPer) + "元 ｜ 小计 " + fmt2(r.sub) + "元");
    });
    lines.push("——————————");
    lines.push("合计：" + fmt2(c.total) + " 元");
    lines.push("印即得彩卡报价工具V1_260831 ｜ copyright©OldK");
    lines.push("时间：" + dateStr);
    copyText(lines.join("\n"), $("btnCopy"));
  });

  function clampNum(el, lo, hi) {
    var n = parseFloat(el.value);
    if (isNaN(n)) n = lo;
    if (n < lo) n = lo;
    if (n > hi) n = hi;
    el.value = n;
  }
  function stripInt(el) { el.value = el.value.replace(/[^\d]/g, ""); }
  var INTS = ["tonPrice", "machineFee", "output"];
  INTS.forEach(function (id) {
    $(id).addEventListener("input", function () { stripInt(this); calcAll(); });
    $(id).addEventListener("change", function () { clampNum(this, CLAMPS[id][0], CLAMPS[id][1]); calcAll(); });
  });
  $("film").addEventListener("input", calcAll);
  $("film").addEventListener("change", function () { clampNum(this, 0, 10); calcAll(); });
  function syncOpts(target) {
    var v = $(target).value.trim();
    Array.prototype.forEach.call(document.querySelectorAll('.dd-menu[data-target="' + target + '"] .dd-opt'), function (o) {
      o.classList.toggle("on", o.getAttribute("data-val") === v);
    });
  }
  function closeMenus() {
    Array.prototype.forEach.call(document.querySelectorAll(".dd-menu"), function (m) { m.classList.remove("open"); });
  }
  Array.prototype.forEach.call(document.querySelectorAll(".dd-caret"), function (btn) {
    btn.addEventListener("click", function (e) {
      e.stopPropagation();
      var target = btn.getAttribute("data-target");
      var menu = document.querySelector('.dd-menu[data-target="' + target + '"]');
      var wasOpen = menu.classList.contains("open");
      closeMenus();
      if (!wasOpen) menu.classList.add("open");
    });
  });
  Array.prototype.forEach.call(document.querySelectorAll(".dd-opt"), function (opt) {
    opt.addEventListener("click", function () {
      var target = opt.parentNode.getAttribute("data-target");
      $(target).value = opt.getAttribute("data-val");
      syncOpts(target);
      calcAll();
      closeMenus();
      $(target).focus();
    });
  });
  document.addEventListener("click", closeMenus);
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeMenus(); });
  $("paperType").addEventListener("input", function () { calcAll(); syncOpts("paperType"); });
  $("paperType").addEventListener("change", function () { if (!this.value.trim()) this.value = "单卡纸"; syncOpts("paperType"); calcAll(); });
  $("gsm").addEventListener("input", function () { stripInt(this); calcAll(); syncOpts("gsm"); });
  $("gsm").addEventListener("change", function () {
    var m = this.value.match(/(\d+(?:\.\d+)?)/);
    var n = m ? parseInt(m[1], 10) : 250;
    if (n < 60) n = 60;
    if (n > 600) n = 600;
    this.value = trimN(n) + "G";
    syncOpts("gsm");
    calcAll();
  });

  makeRow();
  calcAll();
  syncOpts("gsm");
  syncOpts("paperType");
})();
</script>
</body>
</html>
